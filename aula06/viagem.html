<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagem | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="exercicio">
        <h1>Custo da Viagem</h1>

        <label for="distancia">Distância em km</label>
        <input type="number" id="distancia" step="1">

        <label for="consumo">Consumo em km/l</label>
        <input type="number" id="consumo" step="0.1">

        <label for="preco">Preço do litro</label>
        <input type="number" id="preco" step="0.1">

        <button id="calcular">Calcular</button>

        <p id="litrosgastos" class="resultado">Litros gastos:</p>
        <p id="custoida" class="resultado">Custo da ida:</p>
        <p id="custototal" class="resultado">Custo da viagem ida e volta:</p>
    </main>

    <script src="js/viagem.js"></script>
</body>
</html>

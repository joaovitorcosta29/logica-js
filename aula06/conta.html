<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachando a conta | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="exercicio">
        <h1>Conta</h1>

        <label for="Conta">Valor da Conta</label>
        <input type="number" id="conta" step="1">

        <label for="pessoas">Número de Pessoas</label>
        <input type="number" id="pessoas" step="1">

        <button id="calcular">Calcular</button>

        <p id="preco-final" class="resultado">Preço por pessoa:</p>
        <p id="ValorTaxaServico" class="resultado">Serviço:</p>
        <p id="ValorTotal" class="resultado">Total:</p>
    </main>

    <script src="js/conta.js"></script>
</body>
</html>

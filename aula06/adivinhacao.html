<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação</title>
</head>
<body>
    <main>
        <h1>Jogo da Adivinhação</h1>

        <label for="numero">Digite um número entre 1 e 100:</label>
        <input type="number" id="numero" min="1" max="100">

        <button id="adivinhar">Adivinhar</button>

        <p id="resultado" class="resultado"></p>
    </main>

    <script src="js/adivinhacao.js"></script>
</body>
</html>
